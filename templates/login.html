<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AutoLabeler Login</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #101214;
    color: #f3f4f6;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 24px;
  }
  main {
    width: min(100%, 360px);
  }
  h1 {
    font-size: 1.35rem;
    margin: 0 0 18px;
  }
  form {
    display: grid;
    gap: 12px;
  }
  label {
    display: grid;
    gap: 6px;
    color: #a8b0bb;
    font-size: 0.86rem;
  }
  input {
    width: 100%;
    border: 1px solid #2a2f36;
    border-radius: 8px;
    background: #171a1f;
    color: #f3f4f6;
    padding: 12px;
    font-size: 1rem;
  }
  button {
    border: 0;
    border-radius: 8px;
    padding: 12px;
    background: #2d5fff;
    color: #fff;
    font-size: 1rem;
    font-weight: 700;
    cursor: pointer;
  }
  .error {
    margin-bottom: 14px;
    padding: 10px 12px;
    border: 1px solid #8d3140;
    border-radius: 8px;
    background: #3a1c21;
    color: #ffb5c0;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
  <main>
    <h1>AutoLabeler</h1>
    {% if error %}
      <div class="error">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next_url }}" />
      <label>
        Name
        <input name="labeler_name" autocomplete="name" placeholder="Labeler" />
      </label>
      <label>
        Password
        <input name="password" type="password" autocomplete="current-password" required autofocus />
      </label>
      <button type="submit">Sign In</button>
    </form>
  </main>
</body>
</html>

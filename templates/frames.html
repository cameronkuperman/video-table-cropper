<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frame Extraction - Video Table Cropper</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <style>
        .nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        .nav a {
            color: #007bff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .nav a:hover {
            background: #e0e0e0;
        }
        .nav a.active {
            background: #007bff;
            color: white;
        }
        .settings-group {
            margin: 20px 0;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .settings-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }
        .settings-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .settings-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 15px;
        }
        .info-box {
            padding: 12px;
            background: #e7f3ff;
            border-left: 4px solid #007bff;
            border-radius: 4px;
            margin-top: 10px;
        }
        .frame-preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .frame-item {
            background: #f5f5f5;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
        }
        .frame-item img {
            width: 100%;
            height: auto;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">Drive Labeling</a>
            <a href="/legacy">Table Cropper</a>
            <a href="/legacy/frames" class="active">Frame Extraction</a>
        </div>

        <h1>Frame Extraction Tool</h1>
        <p class="subtitle">Extract frames from videos for ML training datasets</p>

        <div class="drop-zones">
            <div class="drop-zone" id="video-zone">
                <div class="drop-zone-content">
                    <div class="icon">🎬</div>
                    <p>Drop video file here</p>
                    <span class="formats">MP4, MOV, AVI, MKV, WebM</span>
                </div>
                <input type="file" id="video-input" accept=".mp4,.mov,.avi,.mkv,.webm" hidden>
                <div class="file-info" id="video-info"></div>
            </div>
        </div>

        <div class="settings-group">
            <label>Extraction Settings</label>
            <div class="settings-row">
                <div>
                    <label for="interval-input">Frame Interval (seconds)</label>
                    <input type="number" id="interval-input" value="30" min="1" max="600">
                    <div class="info-box">
                        <small>30s = ~120 frames/hour<br>60s = ~60 frames/hour</small>
                    </div>
                </div>
                <div>
                    <label for="quality-input">JPEG Quality (1-31, lower=better)</label>
                    <input type="number" id="quality-input" value="2" min="1" max="31">
                    <div class="info-box">
                        <small>2 = High quality (~2MB/frame)<br>5 = Good quality (~1MB/frame)</small>
                    </div>
                </div>
            </div>
        </div>

        <div class="actions">
            <button id="extract-btn" class="btn primary" disabled>
                <span class="btn-text">Extract Frames</span>
                <span class="btn-loading" hidden>Extracting...</span>
            </button>
            <button id="clear-btn" class="btn secondary">Clear</button>
        </div>

        <div id="status" class="status" hidden></div>

        <div id="results" class="results" hidden>
            <h2>Extracted Frames</h2>
            <div id="results-info"></div>
            <button id="download-frames-btn" class="btn primary" style="margin-top: 20px;">Download All Frames (ZIP)</button>
        </div>
    </div>

    <script>
        let uploadedVideo = null;
        let currentJobId = null;

        // DOM elements
        const videoZone = document.getElementById('video-zone');
        const videoInput = document.getElementById('video-input');
        const videoInfo = document.getElementById('video-info');
        const intervalInput = document.getElementById('interval-input');
        const qualityInput = document.getElementById('quality-input');
        const extractBtn = document.getElementById('extract-btn');
        const clearBtn = document.getElementById('clear-btn');
        const status = document.getElementById('status');
        const results = document.getElementById('results');
        const resultsInfo = document.getElementById('results-info');
        const downloadBtn = document.getElementById('download-frames-btn');

        // Drag and drop
        videoZone.addEventListener('click', () => videoInput.click());
        videoZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            videoZone.style.borderColor = '#007bff';
        });
        videoZone.addEventListener('dragleave', () => {
            videoZone.style.borderColor = '#ddd';
        });
        videoZone.addEventListener('drop', (e) => {
            e.preventDefault();
            videoZone.style.borderColor = '#ddd';
            const file = e.dataTransfer.files[0];
            if (file) handleVideoUpload(file);
        });
        videoInput.addEventListener('change', (e) => {
            if (e.target.files[0]) handleVideoUpload(e.target.files[0]);
        });

        // Upload video
        async function handleVideoUpload(file) {
            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch('/upload-frame-video', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    uploadedVideo = data.filename;
                    videoInfo.innerHTML = `
                        <div style="background: #e7f3ff; padding: 12px; border-radius: 6px;">
                            <strong>${data.original}</strong><br>
                            <small>Duration: ${formatDuration(data.duration)} | ${data.resolution} | ${data.fps.toFixed(1)} fps</small>
                        </div>
                    `;
                    videoInfo.style.display = 'block';
                    extractBtn.disabled = false;

                    // Update expected frame count
                    updateFrameEstimate(data.duration);
                } else {
                    showStatus(data.error, 'error');
                }
            } catch (error) {
                showStatus('Upload failed: ' + error.message, 'error');
            }
        }

        // Update frame estimate
        function updateFrameEstimate(duration) {
            const interval = parseInt(intervalInput.value);
            const expectedFrames = Math.floor(duration / interval) + 1;
            const sizeEstimate = (expectedFrames * 2).toFixed(1); // ~2MB per frame

            showStatus(`Expected: ~${expectedFrames} frames (~${sizeEstimate} MB)`, 'info');
        }

        intervalInput.addEventListener('input', () => {
            if (uploadedVideo) {
                const duration = parseDuration(videoInfo.textContent);
                if (duration > 0) updateFrameEstimate(duration);
            }
        });

        // Extract frames
        extractBtn.addEventListener('click', async () => {
            if (!uploadedVideo) return;

            extractBtn.disabled = true;
            extractBtn.querySelector('.btn-text').hidden = true;
            extractBtn.querySelector('.btn-loading').hidden = false;
            results.hidden = true;
            showStatus('Extracting frames... This may take a few minutes.', 'info');

            try {
                const response = await fetch('/process-frames', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        video: uploadedVideo,
                        interval: parseInt(intervalInput.value),
                        quality: parseInt(qualityInput.value)
                    })
                });

                const data = await response.json();

                if (data.success) {
                    currentJobId = data.job_id;
                    showStatus(`Success! Extracted ${data.frame_count} frames`, 'success');
                    displayResults(data);
                } else {
                    showStatus(data.error, 'error');
                }
            } catch (error) {
                showStatus('Extraction failed: ' + error.message, 'error');
            } finally {
                extractBtn.disabled = false;
                extractBtn.querySelector('.btn-text').hidden = false;
                extractBtn.querySelector('.btn-loading').hidden = true;
            }
        });

        // Display results
        function displayResults(data) {
            const metadata = data.metadata;
            const videoInfo = metadata.video_info || {};
            const extractionParams = metadata.extraction_params || {};

            resultsInfo.innerHTML = `
                <div style="background: #f0f8ff; padding: 20px; border-radius: 8px; margin-bottom: 20px;">
                    <h3 style="margin-top: 0;">Extraction Summary</h3>
                    <div style="display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;">
                        <div>
                            <strong>Video:</strong> ${videoInfo.video_name || 'N/A'}<br>
                            <strong>Duration:</strong> ${formatDuration(videoInfo.duration_seconds || 0)}<br>
                            <strong>Resolution:</strong> ${videoInfo.resolution || 'N/A'}
                        </div>
                        <div>
                            <strong>Total Frames:</strong> ${extractionParams.total_frames_extracted || 0}<br>
                            <strong>Interval:</strong> ${extractionParams.interval_seconds || 0}s<br>
                            <strong>Format:</strong> JPEG (quality ${extractionParams.quality || 0})
                        </div>
                    </div>
                </div>
            `;

            results.hidden = false;
        }

        // Download frames
        downloadBtn.addEventListener('click', () => {
            if (currentJobId) {
                window.location.href = `/download-frames/${currentJobId}`;
            }
        });

        // Clear
        clearBtn.addEventListener('click', () => {
            uploadedVideo = null;
            currentJobId = null;
            videoInfo.innerHTML = '';
            videoInfo.style.display = 'none';
            extractBtn.disabled = true;
            results.hidden = true;
            status.hidden = true;
            videoInput.value = '';
        });

        // Show status
        function showStatus(message, type) {
            status.textContent = message;
            status.className = 'status ' + type;
            status.hidden = false;
        }

        // Format duration
        function formatDuration(seconds) {
            const hrs = Math.floor(seconds / 3600);
            const mins = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);

            if (hrs > 0) {
                return `${hrs}h ${mins}m ${secs}s`;
            } else if (mins > 0) {
                return `${mins}m ${secs}s`;
            } else {
                return `${secs}s`;
            }
        }

        // Parse duration from text (helper)
        function parseDuration(text) {
            const match = text.match(/Duration: ([\d:]+)/);
            if (!match) return 0;

            const parts = match[1].split(':').map(Number);
            if (parts.length === 3) {
                return parts[0] * 3600 + parts[1] * 60 + parts[2];
            }
            return 0;
        }
    </script>
</body>
</html>

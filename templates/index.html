<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Table Cropper</title>
    <link rel="stylesheet" href="/static/style.css?v=3">
    <style>
        .nav {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
            padding: 10px;
            background: #f0f0f0;
            border-radius: 8px;
        }
        .nav a {
            color: #007bff;
            text-decoration: none;
            padding: 8px 16px;
            border-radius: 4px;
            transition: background 0.2s;
        }
        .nav a:hover {
            background: #e0e0e0;
        }
        .nav a.active {
            background: #007bff;
            color: white;
        }

        /* Video list */
        .video-list {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .video-item {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 15px;
            transition: border-color 0.2s;
        }

        .video-item:hover {
            border-color: #007bff;
        }

        .video-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .video-name {
            font-weight: 600;
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .remove-btn {
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 14px;
        }

        .remove-btn:hover {
            background: #c82333;
        }

        .camera-selector {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .camera-selector label {
            font-weight: 600;
            color: #555;
        }

        .camera-dropdown {
            flex: 1;
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
            background: white;
        }

        .camera-dropdown:focus {
            outline: none;
            border-color: #007bff;
        }

        .detection-badge {
            background: #28a745;
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: 600;
        }

        /* Warning state for missing camera */
        .video-item.missing-camera {
            border-color: #ffc107;
            background: #fff9e6;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="nav">
            <a href="/">Drive Labeling</a>
            <a href="/legacy" class="active">Table Cropper</a>
            <a href="/legacy/frames">Frame Extraction</a>
        </div>

        <h1>Video Table Cropper</h1>
        <p class="subtitle">Drag and drop multiple videos - cameras will be auto-detected</p>

        <div class="drop-zones">
            <div class="drop-zone" id="video-zone">
                <div class="drop-zone-content">
                    <div class="icon">🎬</div>
                    <p>Drop video files here (multiple allowed)</p>
                    <span class="formats">MP4, MOV, AVI, MKV, WebM</span>
                </div>
                <input type="file" id="video-input" accept=".mp4,.mov,.avi,.mkv,.webm" multiple hidden>

                <!-- List of uploaded videos with camera selectors -->
                <div id="video-list" class="video-list"></div>
            </div>
        </div>

        <div class="actions">
            <button id="process-btn" class="btn primary" disabled>
                <span class="btn-text">Crop Videos</span>
                <span class="btn-loading" hidden>Processing...</span>
            </button>
            <button id="clear-btn" class="btn secondary">Clear All</button>
        </div>

        <div id="status" class="status" hidden></div>

        <div id="results" class="results" hidden>
            <h2>Cropped Videos</h2>
            <p class="download-hint">Click to download (files will appear in your Downloads folder)</p>
            <div id="results-list"></div>
            <button id="download-all-btn" class="btn primary" style="margin-top: 20px;">Download All as ZIP</button>
        </div>
    </div>

    <script src="/static/app.js?v=2"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="csrf-token" content="{{ csrf_token }}" />
<title>AutoLabeler</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f0f0f;
    color: #f0f0f0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }

  header {
    width: 100%;
    max-width: 960px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }

  h1 { font-size: 1.3rem; font-weight: 600; letter-spacing: 0.02em; }

  .header-copy {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  #source-summary {
    font-size: 0.8rem;
    color: #7a7a7a;
  }

  #stats {
    font-size: 0.78rem;
    color: #888;
    text-align: right;
  }

  .source-controls {
    width: 100%;
    max-width: 960px;
    display: flex;
    gap: 12px;
    margin-bottom: 18px;
  }

  .source-control {
    display: flex;
    flex-direction: column;
    gap: 6px;
    min-width: 180px;
  }

  .source-control span {
    font-size: 0.72rem;
    color: #8a8a8a;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .source-control select {
    background: #1b1b1d;
    color: #f0f0f0;
    border: 1px solid #2c2c2e;
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 0.92rem;
  }

  #progress {
    font-size: 0.9rem;
    color: #aaa;
    margin-bottom: 6px;
  }

  #buffer-status {
    font-size: 0.8rem;
    color: #7a7a7a;
    margin-bottom: 16px;
  }

  #error {
    display: none;
    background: #3a1a1a;
    border: 1px solid #8b2020;
    color: #ff6b6b;
    padding: 10px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 0.85rem;
    max-width: 960px;
    width: 100%;
  }

  #card {
    width: 100%;
    max-width: 960px;
  }

  .loading {
    text-align: center;
    color: #666;
    padding: 60px;
  }

  .folder-name {
    font-size: 0.75rem;
    color: #666;
    margin-bottom: 12px;
    font-family: monospace;
  }

  .images {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .image-slot {
    flex: 1;
    min-width: 0;
    min-height: 220px;
    aspect-ratio: 4 / 3;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    background: #1e1e1e;
  }

  .image-slot img {
    width: 100%;
    height: 100%;
    max-height: 340px;
    object-fit: contain;
    opacity: 0;
    transition: opacity 0.12s ease;
  }

  .image-slot.loaded img {
    opacity: 1;
  }

  .img-placeholder {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 0.8rem;
  }

  .image-slot.loaded .img-placeholder {
    display: none;
  }

  .image-slot.error {
    border: 1px solid #8b2020;
  }

  .image-status {
    color: #777;
    font-size: 0.78rem;
    text-align: center;
    margin: -8px 0 14px;
    min-height: 18px;
  }

  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
  }

  .btn {
    flex: 1;
    max-width: 200px;
    padding: 14px 20px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
  }

  .btn:hover { opacity: 0.85; transform: translateY(-1px); }
  .btn:active { transform: translateY(0); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

  .btn.occupied { background: #ff3b30; color: #fff; }
  .btn.dirty    { background: #ff9500; color: #fff; }
  .btn.clean    { background: #34c759; color: #fff; }
  .btn.later    { background: #4f7cff; color: #fff; }
  .btn.skip     { background: #2c2c2e; color: #aaa; max-width: 100px; }

  #done {
    display: none;
    text-align: center;
    padding: 80px 20px;
    color: #666;
  }

  #done h2 { font-size: 1.5rem; margin-bottom: 8px; color: #f0f0f0; }
  #done p  { font-size: 0.9rem; margin-bottom: 24px; }

  #done button {
    padding: 10px 24px;
    background: #2c2c2e;
    color: #aaa;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 0.9rem;
  }

  .hint {
    margin-top: 16px;
    font-size: 0.72rem;
    color: #555;
    text-align: center;
  }

  @media (max-width: 720px) {
    header {
      flex-direction: column;
      align-items: flex-start;
      gap: 12px;
    }

    #stats {
      text-align: left;
    }

    .source-controls {
      flex-direction: column;
    }
  }
</style>
</head>
<body>

<header>
  <div class="header-copy">
    <h1>AutoLabeler</h1>
    <div id="source-summary">Video</div>
  </div>
  <span id="stats"></span>
</header>

<div class="source-controls">
  <label class="source-control">
    <span>Mode</span>
    <select id="source-mode"></select>
  </label>
  <label class="source-control" id="site-control" hidden>
    <span>Site</span>
    <select id="source-site"></select>
  </label>
</div>

<div id="error"></div>
<div id="progress"></div>
<div id="buffer-status"></div>
<div id="card"></div>

<div id="done">
  <h2>All done!</h2>
  <p>No more unlabeled images.</p>
  <button onclick="init(true)">Refresh from Drive</button>
</div>

<p class="hint">Keys: <b>1</b> Occupied &nbsp; <b>2</b> Dirty &nbsp; <b>3</b> Clean &nbsp; <b>4</b> Label Later &nbsp; <b>→ / Space</b> Discard</p>

<script src="/static/app.js"></script>
</body>
</html>

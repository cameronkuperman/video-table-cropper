<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Review</title>
    <link rel="stylesheet" href="/static/style.css?v=7">
    <style>
        body {
            background: #0f1524;
            color: #edf2fb;
        }

        .page {
            max-width: 1500px;
            margin: 0 auto;
            padding: 24px;
        }

        .nav {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        .nav a {
            color: #dbe5ff;
            text-decoration: none;
            padding: 10px 14px;
            background: #1d2740;
            border-radius: 10px;
        }

        .nav a.active {
            background: #345fd9;
        }

        .panel {
            background: #151d31;
            border: 1px solid #263250;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 18px;
        }

        .row {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            align-items: center;
        }

        input {
            background: #0c1220;
            color: #fff;
            border: 1px solid #36425f;
            border-radius: 10px;
            padding: 10px 12px;
            min-width: 320px;
        }

        button {
            border: none;
            border-radius: 10px;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 600;
        }

        .primary {
            background: #2c7a54;
            color: #fff;
        }

        .secondary {
            background: #2a3858;
            color: #fff;
        }

        .warn {
            background: #8d4b28;
            color: #fff;
        }

        .danger {
            background: #a93c55;
            color: #fff;
        }

        button:disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .status, .stats {
            color: #b5c3e2;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .worker-status-block {
            display: grid;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #263250;
        }

        .toolbar {
            position: sticky;
            top: 12px;
            z-index: 20;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 16px;
        }

        .card {
            background: #131b2e;
            border: 2px solid #2a3552;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
        }

        .card.selected {
            border-color: #48d89a;
            box-shadow: 0 0 0 3px rgba(72, 216, 154, 0.18);
        }

        .hero {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            display: block;
            background: #0c1220;
        }

        .support-strip {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 6px 6px 0;
        }

        .support-strip img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 10px;
            background: #0c1220;
        }

        .meta {
            padding: 12px;
            display: grid;
            gap: 6px;
            font-size: 13px;
            color: #c5d1ea;
        }

        .chips {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .chip {
            border-radius: 999px;
            background: #1f2942;
            color: #d8e3fb;
            padding: 5px 10px;
            font-size: 12px;
        }

        .debug-panel {
            display: grid;
            gap: 16px;
        }

        .debug-summary {
            color: #b5c3e2;
            font-size: 14px;
            white-space: pre-wrap;
        }

        .debug-labels {
            display: grid;
            gap: 16px;
        }

        .debug-label {
            border: 1px solid #263250;
            border-radius: 14px;
            padding: 14px;
            background: #101729;
        }

        .debug-label h3 {
            margin: 0 0 10px;
        }

        .debug-export {
            border: 1px solid #24314d;
            border-radius: 12px;
            padding: 12px;
            background: #0d1424;
            margin-top: 12px;
        }

        .debug-export:first-child {
            margin-top: 0;
        }

        .debug-export-head {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
            margin-bottom: 8px;
        }

        .debug-export-title {
            font-weight: 700;
        }

        .debug-path {
            font-family: monospace;
            font-size: 12px;
            color: #a7b7d9;
            word-break: break-all;
            margin-bottom: 10px;
        }

        .debug-files {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 10px;
        }

        .debug-file {
            border: 1px solid #22314d;
            border-radius: 12px;
            padding: 10px;
            background: #121b2f;
            display: grid;
            gap: 8px;
        }

        .debug-file img {
            width: 100%;
            aspect-ratio: 4 / 3;
            object-fit: cover;
            border-radius: 8px;
            background: #0c1220;
        }

        .debug-file-name {
            font-weight: 700;
            word-break: break-word;
        }

        .debug-file-meta {
            color: #b5c3e2;
            font-size: 12px;
        }

        .debug-inline-code {
            display: block;
            font-family: monospace;
            font-size: 12px;
            color: #d9e5ff;
            white-space: pre-wrap;
            word-break: break-word;
        }
    </style>
</head>

<body>
    <div class="page">
        <div class="nav">
            <a href="/video-review" class="active">Video Review</a>
            {% if show_extended_nav %}
            <a href="/">Drive Home</a>
            <a href="/drive/multiclass">Drive Labeling</a>
            <a href="/legacy">Legacy Video</a>
            {% endif %}
        </div>

        <div class="panel">
            <h1>Grouped Video Review</h1>
            <div class="row">
                <input id="review-root" value="{{ default_review_root }}" placeholder="Review root folder ID">
                <input id="batch-limit" type="number" min="1" max="500" value="{{ default_batch_limit }}">
                <button id="start-session" class="primary">Start Session</button>
                <button id="load-more" class="secondary" disabled>Load More</button>
            </div>
            <div id="session-status" class="status"></div>
            <div class="worker-status-block">
                <div id="worker-status" class="status"></div>
                <div id="worker-meta" class="stats"></div>
            </div>
        </div>

        <div class="panel toolbar">
            <span id="selection-info" class="chip">0 selected</span>
            <button id="label-occupied" class="primary" disabled>Occupied (2)</button>
            <button id="label-dirty" class="danger" disabled>Dirty (3)</button>
            <button id="label-clean" class="secondary" disabled>Clean (1)</button>
            <button id="skip-selected" class="warn" disabled>Skip</button>
            <button id="trash-selected" class="danger" disabled>Trash (4)</button>
            <button id="toggle-debug" class="secondary" disabled>Inspect Selected</button>
            <button id="undo-action" class="secondary" disabled>Undo</button>
            <button id="clear-selection" class="secondary" disabled>Clear</button>
        </div>

        <div class="panel">
            <div id="stats" class="stats"></div>
            <div id="debug-panel" class="debug-panel" hidden>
                <div id="debug-status" class="debug-summary"></div>
                <div id="debug-content" class="debug-labels"></div>
            </div>
            <div id="cards" class="grid"></div>
        </div>
    </div>

    <script>
        const defaultReviewRoot = {{ default_review_root | tojson }};
        const defaultBatchLimit = Number({{ default_batch_limit | tojson }});
        const initialWorkerStatus = {{ initial_worker_status | tojson }};
        const workerStatusPath = {{ worker_status_path | tojson }};
        let sessionId = null;
        let cursor = 0;
        let hasMore = false;
        const selected = new Set();
        let lastClicked = null;
        let debugItemId = null;
        let batchRequestInFlight = false;
        let startSessionInFlight = false;
        let actionRequestInFlight = false;
        let sessionGeneration = 0;
        let nextBatchRequestId = 0;
        let currentBatchRequestId = 0;
        let workerStatusStream = null;
        let workerReconnectTimer = null;
        let lastWorkerStatus = initialWorkerStatus;
        let lastCompletedWorkerSeq = null;
        let lastWorkerSampleCount = Number((initialWorkerStatus?.counters || {}).sample_count_created || 0);
        let lastWorkerPendingCount = Number((initialWorkerStatus?.counters || {}).pending_sample_count || 0);

        const startBtn = document.getElementById('start-session');
        const loadMoreBtn = document.getElementById('load-more');
        const cards = document.getElementById('cards');
        const statsEl = document.getElementById('stats');
        const statusEl = document.getElementById('session-status');
        const workerStatusEl = document.getElementById('worker-status');
        const workerMetaEl = document.getElementById('worker-meta');
        const selectionEl = document.getElementById('selection-info');
        const labelButtons = {
            clean: document.getElementById('label-clean'),
            occupied: document.getElementById('label-occupied'),
            dirty: document.getElementById('label-dirty')
        };
        const skipBtn = document.getElementById('skip-selected');
        const trashBtn = document.getElementById('trash-selected');
        const debugBtn = document.getElementById('toggle-debug');
        const undoBtn = document.getElementById('undo-action');
        const clearBtn = document.getElementById('clear-selection');
        const debugPanel = document.getElementById('debug-panel');
        const debugStatusEl = document.getElementById('debug-status');
        const debugContentEl = document.getElementById('debug-content');
        const actionLabels = {
            label: 'Label',
            skip: 'Skip',
            trash: 'Trash'
        };

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#39;');
        }

        function clearDebugPanel(hide = true) {
            debugItemId = null;
            debugStatusEl.textContent = '';
            debugContentEl.innerHTML = '';
            if (hide) {
                debugPanel.hidden = true;
            }
        }

        function updateSelectionUi() {
            const count = selected.size;
            selectionEl.textContent = `${count} selected`;
            Object.values(labelButtons).forEach((button) => button.disabled = !count);
            skipBtn.disabled = !count;
            trashBtn.disabled = !count;
            clearBtn.disabled = !count;
            debugBtn.disabled = !sessionId || count !== 1;
            if (count !== 1) {
                clearDebugPanel(true);
            }
        }

        function setStatus(message) {
            statusEl.textContent = message || '';
        }

        function formatEpoch(epochSeconds) {
            if (!epochSeconds) {
                return 'never';
            }
            return new Date(epochSeconds * 1000).toLocaleString();
        }

        function workerStateIsActive(state) {
            return [
                'listing_source_videos',
                'ready_to_process',
                'processing_video',
                'downloading_video',
                'extracting_frames',
                'detecting_frames',
                'uploading_samples',
                'waiting_for_review_capacity'
            ].includes(state);
        }

        function renderWorkerStatus(status, statusPathValue = workerStatusPath) {
            if (!status) {
                workerStatusEl.textContent = 'Worker status unavailable.';
                workerMetaEl.textContent = '';
                return;
            }

            const updatedAtEpoch = Number(status.updated_at_epoch || status.heartbeat_at_epoch || 0);
            const stale = Boolean(status.stale) || (updatedAtEpoch > 0 && (Date.now() - (updatedAtEpoch * 1000)) > 60000);
            const displayState = stale ? 'offline' : (status.state || 'unknown');
            const lines = [`Worker: ${displayState}`];
            if (status.message) {
                lines.push(status.message);
            }
            if (status.current_video && status.current_video.name) {
                lines.push(`Current video: ${status.current_video.name}`);
            }
            if (stale) {
                lines.push('Worker heartbeat is stale. Review samples will not refresh until the worker reconnects.');
            }
            if (status.last_error) {
                lines.push(`Last error: ${status.last_error}`);
            }
            workerStatusEl.textContent = lines.join('\n');

            const counters = status.counters || {};
            workerMetaEl.textContent =
                `Seen: ${counters.videos_seen || 0}  ` +
                `Selected: ${counters.videos_selected || 0}  ` +
                `Processed: ${counters.videos_processed || 0}  ` +
                `Skipped: ${counters.videos_skipped || 0}  ` +
                `Samples created: ${counters.sample_count_created || 0}  ` +
                `Pending in Drive: ${counters.pending_sample_count || 0}\n` +
                `Updated: ${formatEpoch(status.updated_at_epoch)}\n` +
                `Status file: ${statusPathValue}`;
        }

        function workerStatusSummary(status = lastWorkerStatus) {
            if (!status) {
                return 'unknown';
            }
            const updatedAtEpoch = Number(status.updated_at_epoch || status.heartbeat_at_epoch || 0);
            const stale = Boolean(status.stale) || (updatedAtEpoch > 0 && (Date.now() - (updatedAtEpoch * 1000)) > 60000);
            return stale ? 'offline' : (status.state || 'unknown');
        }

        function maybeRefreshQueueFromWorker(status) {
            if (!sessionId || !status) {
                return;
            }

            const counters = status.counters || {};
            const sampleCount = Number(counters.sample_count_created || 0);
            const pendingCount = Number(counters.pending_sample_count || 0);
            const countsAdvanced =
                sampleCount > lastWorkerSampleCount ||
                pendingCount > lastWorkerPendingCount;

            lastWorkerSampleCount = sampleCount;
            lastWorkerPendingCount = pendingCount;

            if (countsAdvanced && workerStateIsActive(status.state)) {
                loadBatch({ silent: true });
                return;
            }

            if (status.state === 'completed' && status.event_seq !== lastCompletedWorkerSeq) {
                lastCompletedWorkerSeq = status.event_seq;
                loadBatch({ silent: true });
            }
        }

        function handleWorkerStatusPayload(payload) {
            if (!payload || !payload.status) {
                return;
            }
            lastWorkerStatus = payload.status;
            renderWorkerStatus(payload.status, payload.status_path);
            maybeRefreshQueueFromWorker(payload.status);
        }

        async function fetchWorkerStatusSnapshot() {
            const response = await fetch('/api/video-review/worker-status');
            let data;
            try {
                data = await readApiResponse(response);
            } catch (error) {
                workerStatusEl.textContent = `Worker status fetch failed: ${error.message}`;
                return;
            }
            if (!data.success) {
                workerStatusEl.textContent = data.error || 'Worker status fetch failed.';
                return;
            }
            handleWorkerStatusPayload(data);
        }

        function connectWorkerStatusStream() {
            if (!window.EventSource) {
                fetchWorkerStatusSnapshot();
                window.setInterval(fetchWorkerStatusSnapshot, 5000);
                return;
            }

            if (workerReconnectTimer) {
                window.clearTimeout(workerReconnectTimer);
                workerReconnectTimer = null;
            }
            if (workerStatusStream) {
                workerStatusStream.close();
            }

            workerStatusStream = new EventSource('/api/video-review/worker-status/stream');
            workerStatusStream.onmessage = (event) => {
                if (workerReconnectTimer) {
                    window.clearTimeout(workerReconnectTimer);
                    workerReconnectTimer = null;
                }
                try {
                    handleWorkerStatusPayload(JSON.parse(event.data));
                } catch (error) {
                    workerStatusEl.textContent = `Worker status parse failed: ${error.message}`;
                }
            };
            workerStatusStream.onerror = () => {
                if (workerStatusStream) {
                    workerStatusStream.close();
                    workerStatusStream = null;
                }
                if (workerReconnectTimer) {
                    window.clearTimeout(workerReconnectTimer);
                }
                workerReconnectTimer = window.setTimeout(() => {
                    fetchWorkerStatusSnapshot();
                    connectWorkerStatusStream();
                }, 5000);
            };
        }

        async function readApiResponse(response) {
            const text = await response.text();
            try {
                return JSON.parse(text);
            } catch (error) {
                throw new Error(text || `HTTP ${response.status}`);
            }
        }

        function renderStats(stats) {
            if (!stats) {
                statsEl.textContent = '';
                return;
            }
            statsEl.textContent =
                `Pending: ${stats.status_counts.pending || 0}  ` +
                `Labeled: ${stats.status_counts.labeled || 0}  ` +
                `Skipped: ${stats.status_counts.skipped || 0}  ` +
                `Trashed: ${stats.status_counts.trashed || 0}`;
            undoBtn.disabled =
                (stats.status_counts.labeled || 0) +
                (stats.status_counts.skipped || 0) +
                (stats.status_counts.trashed || 0) === 0;
        }

        function toggleSelection(card, additive = true) {
            const id = Number(card.dataset.itemId);
            if (!additive) {
                document.querySelectorAll('.card.selected').forEach((node) => node.classList.remove('selected'));
                selected.clear();
            }

            if (selected.has(id)) {
                selected.delete(id);
                card.classList.remove('selected');
            } else {
                selected.add(id);
                card.classList.add('selected');
            }
            lastClicked = card;
            updateSelectionUi();
            if (!debugPanel.hidden && selected.size === 1) {
                loadDebugPreview(true);
            }
        }

        function createCard(item) {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.itemId = item.id;
            card.innerHTML = `
                <img class="hero" src="${item.preview_urls.anchor}" alt="${item.sample_id}">
                <div class="support-strip">
                    <img src="${item.preview_urls.t_minus_20}" alt="${item.sample_id} prior 2">
                    <img src="${item.preview_urls.t_minus_10}" alt="${item.sample_id} prior 1">
                </div>
                <div class="meta">
                    <div class="chips">
                        <span class="chip">${item.camera_id}</span>
                        <span class="chip">${item.anchor_time_seconds}s</span>
                        <span class="chip">${item.table_track_id}</span>
                        <span class="chip">${item.associated_people_count} people</span>
                    </div>
                    <div>${item.video_name}</div>
                    <div>${item.sample_id}</div>
                </div>
            `;
            card.addEventListener('click', (event) => {
                if (event.shiftKey && lastClicked) {
                    const allCards = Array.from(document.querySelectorAll('.card'));
                    const start = allCards.indexOf(lastClicked);
                    const end = allCards.indexOf(card);
                    const [lo, hi] = [Math.min(start, end), Math.max(start, end)];
                    for (let idx = lo; idx <= hi; idx += 1) {
                        const node = allCards[idx];
                        node.classList.add('selected');
                        selected.add(Number(node.dataset.itemId));
                    }
                    updateSelectionUi();
                    return;
                }
                toggleSelection(card, event.metaKey || event.ctrlKey);
            });
            return card;
        }

        async function startSession() {
            if (startSessionInFlight) {
                return;
            }
            const reviewRoot = document.getElementById('review-root').value.trim() || defaultReviewRoot;
            const batchLimit = Number(document.getElementById('batch-limit').value || String(defaultBatchLimit || 60));
            if (!reviewRoot) {
                setStatus('Review root folder ID is required.');
                return;
            }

            try {
                startSessionInFlight = true;
                startBtn.disabled = true;
                const response = await fetch('/api/video-review/session/start', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ review_root_folder_id: reviewRoot, batch_limit: batchLimit })
                });
                let data;
                try {
                    data = await readApiResponse(response);
                } catch (error) {
                    setStatus(`Start session failed: ${error.message}`);
                    return;
                }
                if (!data.success) {
                    setStatus(data.error || 'Failed to start session.');
                    return;
                }

                sessionGeneration += 1;
                sessionId = data.session_id;
                currentBatchRequestId = 0;
                batchRequestInFlight = false;
                if (data.review_root_folder_id) {
                    document.getElementById('review-root').value = data.review_root_folder_id;
                }
                cursor = 0;
                hasMore = false;
                cards.innerHTML = '';
                selected.clear();
                lastClicked = null;
                clearDebugPanel(true);
                updateSelectionUi();
                renderStats(data.stats);
                if (data.queue_items_created === 0) {
                    setStatus(`Session started, but no review cards are ready yet. Worker is ${workerStatusSummary()}.`);
                } else {
                    setStatus(`Session ${sessionId} started. ${data.queue_items_created} pending review cards are ready.`);
                }
                await loadBatch({ sessionGeneration });
            } finally {
                startSessionInFlight = false;
                startBtn.disabled = false;
            }
        }

        async function loadBatch(options = {}) {
            if (!sessionId || batchRequestInFlight) {
                return;
            }
            const silent = Boolean(options.silent);
            const requestGeneration = Number(options.sessionGeneration || sessionGeneration);
            const requestSessionId = sessionId;
            const requestCursor = cursor;
            const requestId = ++nextBatchRequestId;
            currentBatchRequestId = requestId;
            batchRequestInFlight = true;
            try {
                const batchLimit = Number(document.getElementById('batch-limit').value || String(defaultBatchLimit || 60));
                const response = await fetch(`/api/video-review/session/${requestSessionId}/batch?cursor=${requestCursor}&limit=${batchLimit}`);
                let data;
                try {
                    data = await readApiResponse(response);
                } catch (error) {
                    setStatus(`Load batch failed: ${error.message}`);
                    return;
                }
                if (requestGeneration !== sessionGeneration || requestSessionId !== sessionId || requestId !== currentBatchRequestId) {
                    return;
                }
                if (!data.success) {
                    setStatus(data.error || 'Failed to load batch.');
                    return;
                }

                data.items.forEach((item) => cards.appendChild(createCard(item)));
                cursor = data.next_cursor;
                hasMore = Boolean(data.has_more);
                loadMoreBtn.disabled = !hasMore;
                renderStats(data.stats);
                if (!silent && !data.items.length && cursor === 0 && !(data.errors && data.errors.length)) {
                    setStatus(`No review cards ready yet; worker is ${workerStatusSummary()}.`);
                } else if (data.errors && data.errors.length && !silent) {
                    setStatus(data.errors.join('\n'));
                }
            } finally {
                if (requestId === currentBatchRequestId) {
                    batchRequestInFlight = false;
                }
            }
        }

        async function applyAction(path, payload = {}) {
            if (!sessionId || actionRequestInFlight) {
                return;
            }
            const itemIds = Array.from(selected.values());
            const requestSessionId = sessionId;
            if (!itemIds.length) {
                setStatus('No items selected.');
                return;
            }
            try {
                actionRequestInFlight = true;
                const response = await fetch(`/api/video-review/session/${requestSessionId}/${path}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ item_ids: itemIds, ...payload })
                });
                let data;
                try {
                    data = await readApiResponse(response);
                } catch (error) {
                    setStatus(`${path} failed: ${error.message}`);
                    return;
                }
                if (requestSessionId !== sessionId) {
                    return;
                }
                if (!data.success) {
                    if ((data.error || '').includes('No pending items found for supplied item_ids')) {
                        setStatus('Selected cards were stale for the active session. Refreshing the batch.');
                        selected.clear();
                        clearDebugPanel(true);
                        updateSelectionUi();
                        cards.innerHTML = '';
                        cursor = 0;
                        await loadBatch({ silent: true, sessionGeneration });
                        return;
                    }
                    setStatus(data.error || `Failed to ${path}.`);
                    return;
                }

                const processedItemIds = data.labeled_item_ids || data.skipped_item_ids || data.trashed_item_ids || [];
                processedItemIds.forEach((itemId) => {
                    const card = document.querySelector(`.card[data-item-id="${itemId}"]`);
                    if (card) card.remove();
                    selected.delete(Number(itemId));
                });
                if (processedItemIds.length) {
                    lastClicked = null;
                }
                clearDebugPanel(true);
                updateSelectionUi();
                renderStats(data.stats);
                if (data.errors && data.errors.length) {
                    setStatus(
                        `${actionLabels[path] || path} completed for ${processedItemIds.length} item(s).\n${data.errors.join('\n')}`
                    );
                } else {
                    setStatus(`${actionLabels[path] || path} completed for ${processedItemIds.length} item(s).`);
                }
            } finally {
                actionRequestInFlight = false;
            }
        }

        async function undoAction() {
            if (!sessionId) {
                return;
            }
            const response = await fetch(`/api/video-review/session/${sessionId}/undo`, { method: 'POST' });
            let data;
            try {
                data = await readApiResponse(response);
            } catch (error) {
                setStatus(`Undo failed: ${error.message}`);
                return;
            }
            if (!data.success) {
                setStatus(data.error || 'Undo failed.');
                return;
            }
            cards.innerHTML = '';
            cursor = 0;
            renderStats(data.stats);
            clearDebugPanel(true);
            setStatus('Last action undone.');
            await loadBatch();
        }

        function renderDebugFile(itemId, file) {
            const meta = `${file.content_type || 'application/octet-stream'}  ${file.size_bytes} bytes`;
            const imageHtml = file.source_preview_kind
                ? `<img src="/api/video-review/session/${sessionId}/preview/${itemId}/${file.source_preview_kind}" alt="${escapeHtml(file.file_name)}">`
                : '';
            const summary = file.json_preview
                ? `<span class="debug-inline-code">${escapeHtml(JSON.stringify(file.json_preview, null, 2))}</span>`
                : file.npz_summary
                    ? `<span class="debug-inline-code">${escapeHtml(JSON.stringify(file.npz_summary, null, 2))}</span>`
                    : '';
            return `
                <div class="debug-file">
                    ${imageHtml}
                    <div class="debug-file-name">${escapeHtml(file.file_name)}</div>
                    <div class="debug-file-meta">${escapeHtml(meta)}</div>
                    ${summary}
                </div>
            `;
        }

        function renderDebugExport(itemId, plan) {
            const filesHtml = (plan.files || []).map((file) => renderDebugFile(itemId, file)).join('');
            return `
                <div class="debug-export">
                    <div class="debug-export-head">
                        <div class="debug-export-title">${escapeHtml(plan.task)} -> ${escapeHtml(plan.label)}</div>
                        <span class="chip">${escapeHtml(plan.task_root_name)}</span>
                    </div>
                    <div class="debug-path">${escapeHtml(`${plan.task_root_name}/${plan.relative_folder}`)}</div>
                    <div class="debug-files">${filesHtml}</div>
                </div>
            `;
        }

        function renderDebugLabel(itemId, label, plans) {
            const exportsHtml = (plans || []).map((plan) => renderDebugExport(itemId, plan)).join('');
            return `
                <section class="debug-label">
                    <h3>If labeled ${escapeHtml(label)}</h3>
                    ${exportsHtml || '<div class="debug-file-meta">No export targets configured.</div>'}
                </section>
            `;
        }

        async function loadDebugPreview(forceOpen = false) {
            if (!sessionId || selected.size !== 1) {
                return;
            }
            const itemId = Array.from(selected.values())[0];
            if (!forceOpen && !debugPanel.hidden && debugItemId === itemId) {
                clearDebugPanel(true);
                return;
            }

            const response = await fetch(`/api/video-review/session/${sessionId}/debug/${itemId}`);
            let data;
            try {
                data = await readApiResponse(response);
            } catch (error) {
                debugPanel.hidden = false;
                debugStatusEl.textContent = `Inspect failed: ${error.message}`;
                debugContentEl.innerHTML = '';
                return;
            }
            if (!data.success) {
                debugPanel.hidden = false;
                debugStatusEl.textContent = data.error || 'Inspect failed.';
                debugContentEl.innerHTML = '';
                return;
            }

            const sample = data.sample;
            debugItemId = itemId;
            debugPanel.hidden = false;
            debugStatusEl.textContent =
                `${sample.sample_id}\n` +
                `${sample.camera_id}  ${sample.anchor_time_seconds}s  ${sample.table_track_id}\n` +
                `${sample.video_name}`;
            debugContentEl.innerHTML = ['occupied', 'dirty', 'clean']
                .map((label) => renderDebugLabel(itemId, label, sample.labels[label] || []))
                .join('');
        }

        startBtn.addEventListener('click', startSession);
        loadMoreBtn.addEventListener('click', loadBatch);
        labelButtons.clean.addEventListener('click', () => applyAction('label', { label: 'clean' }));
        labelButtons.occupied.addEventListener('click', () => applyAction('label', { label: 'occupied' }));
        labelButtons.dirty.addEventListener('click', () => applyAction('label', { label: 'dirty' }));
        skipBtn.addEventListener('click', () => applyAction('skip'));
        trashBtn.addEventListener('click', () => applyAction('trash'));
        debugBtn.addEventListener('click', () => loadDebugPreview(false));
        undoBtn.addEventListener('click', undoAction);
        clearBtn.addEventListener('click', () => {
            selected.clear();
            document.querySelectorAll('.card.selected').forEach((node) => node.classList.remove('selected'));
            clearDebugPanel(true);
            updateSelectionUi();
        });

        document.addEventListener('keydown', (event) => {
            if (event.target.tagName === 'INPUT') return;
            if (event.key === '1') labelButtons.clean.click();
            if (event.key === '2') labelButtons.occupied.click();
            if (event.key === '3') labelButtons.dirty.click();
            if (event.key === '4') trashBtn.click();
            if (event.key === 'Escape') clearBtn.click();
        });

        handleWorkerStatusPayload({ status: initialWorkerStatus, status_path: workerStatusPath });
        connectWorkerStatusStream();
        document.getElementById('batch-limit').value = String(defaultBatchLimit || 60);
        if (defaultReviewRoot) {
            startSession();
        } else {
            setStatus('Review root folder ID is required.');
        }
    </script>
</body>

</html>
